name: Build mod

on:
  push:
    paths-ignore:
      - 'build-output/**'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1

      - name: Try to fetch TACZ (optional, for runtime smoke test)
        id: fetch-tacz
        run: |
          mkdir -p libs build-output
          echo "Querying Modrinth for the TACZ 1.20.1 jar..."
          URL=$(curl -sS --max-time 60 'https://api.modrinth.com/v2/project/tacz/version' \
            | python3 -c "
import json,sys
try:
    vs = json.load(sys.stdin)
except Exception as e:
    print(''); raise SystemExit(0)
for v in vs:
    loaders = v.get('loaders') or []
    gvs = v.get('game_versions') or []
    if 'forge' in loaders and '1.20.1' in gvs:
        files = sorted(v.get('files', []), key=lambda f: f.get('primary', False), reverse=True)
        if files:
            print(files[0]['url'])
            break
") || URL=""
          echo "URL=${URL}"
          if [ -n "${URL}" ]; then
            curl -sSL --max-time 300 -o libs/tacz.jar "${URL}" || { echo "TACZ download failed"; rm -f libs/tacz.jar; echo "tacz=false" >> "$GITHUB_OUTPUT"; exit 0; }
            ls -la libs/tacz.jar
            echo "tacz=true" >> "$GITHUB_OUTPUT"
          else
            echo "Could not resolve TACZ jar from Modrinth; smoke test will be skipped."
            echo "tacz=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the mod
        run: |
          mkdir -p build-output
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build-output/build.log
          ls -la build/libs | tee -a build-output/build.log

      - name: Runtime smoke test with TACZ (best effort)
        if: steps.fetch-tacz.outputs.tacz == 'true' && hashFiles('build/libs/*.jar') != ''
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          set -o pipefail
          ( timeout 420 gradle runServer --no-daemon 2>&1 || true ) | tee build-output/server.log
          echo "--- server start markers ---"
          grep -E "Done|ERROR|FATAL|Exception" build-output/server.log | head -60 || true

      - name: Publish build results back to the branch
        if: always()
        run: |
          git config user.name "arena-build-bot"
          git config user.email "arena-build-bot@users.noreply.github.com"
          mkdir -p build-output
          cp -f build/libs/*.jar build-output/ 2>/dev/null || true
          rm -f libs/tacz.jar
          git add -f build-output
          git commit -m "chore(ci): build artifacts and logs [skip ci]" || echo "nothing new to commit"
          git pull --rebase origin arena/01a04c19-mod || true
          git push origin HEAD:arena/01a04c19-mod
