modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
logoFile = "logo.png"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# TACZ is optional at load time: without it soldiers fall back to plain arrows.
# With TACZ installed soldiers receive real TACZ guns and fire TACZ bullets.
[[dependencies.${mod_id}]]
modId = "tacz"
mandatory = false
versionRange = "${tacz_version_range}"
ordering = "AFTER"
side = "BOTH"
